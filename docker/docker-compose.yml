version: '2.0'
services:
  chatgpt-on-wechat:
    image: zhayujie/chatgpt-on-wechat
    container_name: chatgpt-on-wechat
    security_opt:
      - seccomp:unconfined
    environment:
      CHANNEL_TYPE: 'kkkkyo'
      OPEN_AI_API_KEY: 'fastgpt-lRDRMV2pxdWMIfToAujQWc2CZl5dtlOmjk1xU8gp0A6LihS6sjkSRoNT58LpC'
      MODEL: ''
      PROXY: ''
      SINGLE_CHAT_PREFIX: '["咖啡助手", "@咖啡助手"]'
      SINGLE_CHAT_REPLY_PREFIX: '"[咖啡助手] "'
      GROUP_CHAT_PREFIX: '["@咖啡助手"]'
      GROUP_NAME_WHITE_LIST: '["珠海聊聊天", "想个群名得半天"]'
      IMAGE_CREATE_PREFIX: '["画", "看", "找"]'
      CONVERSATION_MAX_TOKENS: 1000
      SPEECH_RECOGNITION: 'False'
      CHARACTER_DESC: '你是基于大语言模型的AI智能助手，旨在回答并解决人们的任何问题，并且可以使用多种语言与人交流。'
      EXPIRES_IN_SECONDS: 3600
      USE_GLOBAL_PLUGIN_CONFIG: 'True'
      USE_LINKAI: 'False'
      LINKAI_API_KEY: ''
      LINKAI_APP_CODE: ''
